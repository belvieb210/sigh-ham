# SIGH HAM — VirtualHost Apache (coexistence avec vos autres sites)
# Cible : /etc/apache2/sites-available/sigh-ham.conf
#
# Apache reste sur le port 80. Ce vhost ne concerne que hamlab5.duckdns.org.
# Next.js :3000 | Socket.IO :3001
#
# Installation :
#   a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   cp deploy/apache/sigh-ham.conf /etc/apache2/sites-available/sigh-ham.conf
#   a2ensite sigh-ham
#   apache2ctl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName hamlab5.duckdns.org

    ErrorLog ${APACHE_LOG_DIR}/sigh-ham-error.log
    CustomLog ${APACHE_LOG_DIR}/sigh-ham-access.log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Socket.IO — messagerie temps réel (WebSocket)
    ProxyPass        /socket.io/ ws://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ ws://127.0.0.1:3001/socket.io/

    # Uploads locaux messagerie
    Alias /uploads /var/www/sigh-ham/public/uploads
    <Directory /var/www/sigh-ham/public/uploads>
        Require all granted
        Options -Indexes
    </Directory>

    # Next.js (tout le reste)
    ProxyPass        /uploads !
    ProxyPass        / http://127.0.0.1:3000/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket upgrade (fallback polling Socket.IO)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]
</VirtualHost>

# Après certbot SSL, certbot ajoutera un bloc *:443 ou un fichier ssl séparé.
# Commande : certbot --apache -d hamlab5.duckdns.org
