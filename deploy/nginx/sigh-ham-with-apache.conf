# Nginx (port 80) + Apache (port 8080) — Nginx devant, Apache pour les autres sites
#
# 1. Modifier /etc/apache2/ports.conf : Listen 8080 (au lieu de 80)
# 2. Tous vos VirtualHost Apache : <VirtualHost *:8080>
# 3. Copier ce fichier vers /etc/nginx/sites-available/sigh-ham
# 4. systemctl restart apache2 nginx

upstream sigh_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream sigh_socketio {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream apache_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ─── SIGH HAM (domaine dédié) ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hamlab5.duckdns.org;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /socket.io/ {
        proxy_pass http://sigh_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        alias /var/www/sigh-ham/public/uploads/;
    }

    location / {
        proxy_pass http://sigh_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Autres sites (Apache sur 8080) ─────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://apache_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
