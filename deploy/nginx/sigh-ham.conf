# SIGH HAM — Nginx (hamlab5.duckdns.org)
# Fichier cible : /etc/nginx/sites-available/sigh-ham

upstream sigh_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream sigh_socketio {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Redirection HTTP → HTTPS (activé après certbot)
server {
    listen 80;
    listen [::]:80;
    server_name hamlab5.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hamlab5.duckdns.org;

    # Certificats Let's Encrypt (certbot les ajoute / met à jour)
    ssl_certificate     /etc/letsencrypt/live/hamlab5.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamlab5.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    # Fichiers statiques Next.js (cache)
    location /_next/static/ {
        proxy_pass http://sigh_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Socket.IO — messagerie & notifications temps réel
    location /socket.io/ {
        proxy_pass http://sigh_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Uploads locaux (messagerie sans MinIO)
    location /uploads/ {
        alias /var/www/sigh-ham/public/uploads/;
        add_header Cache-Control "private, max-age=3600";
    }

    location / {
        proxy_pass http://sigh_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
